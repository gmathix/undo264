[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "undo264-viewer"
version = "0.1.0"
description = "Stream/decoding visualizer for the undo264 H.264 decoder"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7"]   # display layer
fast = ["orjson>=3.9"]  # faster JSON parsing on large dumps
dev = ["pytest>=8"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]